[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-kernel-evolution"
version = "0.2.0"
description = "CAKE and BAKER for LLM-guided Bayesian optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "botorch>=0.11",
    "gpytorch>=1.11",
    "numpy>=1.24",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
